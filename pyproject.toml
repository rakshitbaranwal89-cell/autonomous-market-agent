[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-market-agent"
version = "0.1.0"
description = "India-first, paper-only market-agent foundation with deterministic risk controls."
requires-python = ">=3.11"
authors = [{name = "Project maintainers"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
